name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (اختياري، مثال: com.yourname.proxypin)"
        required: false
        default: ""
      team_id:
        description: "Apple Team ID (اختياري)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Optional - use your own bundle id / team / app group
        if: ${{ github.event.inputs.bundle_id != '' && github.event.inputs.bundle_id != null }}
        run: |
          set -e
          BID="${{ github.event.inputs.bundle_id }}"
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/com\.proxy\.pin/${BID}/g" $PBX ios/Runner/Runner.entitlements ios/ProxyPin/ProxyPin.entitlements
          if [ -n "${{ github.event.inputs.team_id }}" ]; then
            sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${{ github.event.inputs.team_id }};/g" $PBX
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Embed entitlements (ad-hoc signature, so signing tools keep the VPN capability)
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" ios/Runner/Runner.entitlements)
          cat > ent-ext.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.networking.networkextension</key><array><string>packet-tunnel-provider</string></array>
            <key>com.apple.security.application-groups</key><array><string>${GROUP}</string></array>
          </dict></plist>
          PLIST
          sed 's/^          //' ent-ext.plist > ent.plist
          plutil -lint ent.plist
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign -f -s - "$f"
          done
          codesign -f -s - --entitlements ent.plist "$APP/PlugIns/ProxyPin.appex"
          codesign -f -s - --entitlements ent.plist "$APP"
          echo "--- app entitlements"; codesign -d --entitlements :- "$APP"
          echo "--- extension entitlements"; codesign -d --entitlements :- "$APP/PlugIns/ProxyPin.appex"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry proxypin_mod-unsigned.ipa Payload
          ls -la proxypin_mod-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: proxypin_mod-unsigned
          path: proxypin_mod-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: proxypin_mod iOS build ${{ github.run_number }}
          body: "IPA بتوقيع مؤقت (ad-hoc) يحمل صلاحية VPN. أعد توقيعه بحساب مطوّر مدفوع (Sideloadly / ESign) قبل التثبيت."
          files: proxypin_mod-unsigned.ipa
